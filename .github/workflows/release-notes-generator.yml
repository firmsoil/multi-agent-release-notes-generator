name: multi-agent-release-notes-generator

on:
  push:
    tags:
      - 'v*.*.*'   # Trigger on version tags, e.g., v1.2.3

jobs:
  generate_release_notes:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install -r requirements.txt

    - name: Set environment variables
      run: |
        echo "GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}" >> $GITHUB_ENV
        echo "GENAI_API_KEY=${{ secrets.GENAI_API_KEY }}" >> $GITHUB_ENV

    - name: Generate release notes
      run: |
        source .venv/bin/activate
        # Use the previous tag as start, current tag as end
        START_COMMIT=$(git describe --tags --abbrev=0 $(git rev-list --tags --skip=1 --max-count=1))
        END_COMMIT=$(git describe --tags --abbrev=0)
        VERSION=$END_COMMIT
        python release_notes_agents.py           --mode github           --repo https://github.com/${{ github.repository }}.git           --start $START_COMMIT           --end $END_COMMIT           --version $VERSION           --product MyProduct           --github-token $GITHUB_TOKEN           --genai-key $GENAI_API_KEY

    - name: Commit release notes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add release_notes.txt
        git commit -m "Update release notes for $VERSION" || echo "No changes to commit"
        git push
